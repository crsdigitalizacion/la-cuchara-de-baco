<head>
  <meta charset="utf-8">

  <title>Política de privacidad | La Cuchara de Baco</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>
    /* El navegador puede saltarse la transición entre páginas, sobre todo la primera
       vez que carga una: entonces la página entra con un fundido. Va aquí porque
       el aviso llega antes que el JavaScript del final de la página. */
    addEventListener('pagereveal', function (evento) {
      var transicion = evento.viewTransition;
      var fundir = function () { document.documentElement.classList.add('fundido'); };
      if (!transicion) { fundir(); return; }
      transicion.ready.catch(fundir);
      transicion.finished.catch(function () {});
    });
  </script>
</head>

    <h1>Política de privacidad</h1>

    <p>Aquí irá la política de privacidad. Esta web no usa formularios, cookies propias ni herramientas de analítica.</p>
  </main>
</body>
</html>
